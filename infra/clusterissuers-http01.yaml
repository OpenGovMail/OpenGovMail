# Let's Encrypt ClusterIssuers using HTTP-01 via Traefik. Use instead of
# infra/bootstrap.sh when DNS is not on Cloudflare. Needs the mail host's A record
# pointing at the node and inbound port 80 open.
#
#   kubectl apply -f infra/clusterissuers-http01.yaml
#   kubectl get clusterissuer   # le-staging, le-prod -> READY=True
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: le-staging
spec:
  acme:
    server: https://acme-staging-v02.api.letsencrypt.org/directory
    privateKeySecretRef:
      name: le-staging-account-key
    solvers:
      - http01:
          ingress:
            ingressClassName: traefik
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: le-prod
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    privateKeySecretRef:
      name: le-prod-account-key
    solvers:
      - http01:
          ingress:
            ingressClassName: traefik

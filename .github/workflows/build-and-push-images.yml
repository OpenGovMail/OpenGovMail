name: Build and Push Docker Images

on:
  push:
    branches:
      - main
    # A release tag (v0.4.0) builds every image as 0.4.0. Not v.0.4.0: semver can't parse it.
    tags:
      - 'v[0-9]*'
  # Pull requests build and scan the changed images to catch a broken Dockerfile
  # or a vulnerable image before it merges, but never log in or push.
  pull_request:
    paths:
      - 'services/**'
      - '.github/workflows/build-and-push-images.yml'
  workflow_dispatch:

# A new push to a pull request cancels its build in progress.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: OpenGovMail/opengovmail

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    if: github.repository == 'OpenGovMail/OpenGovMail'
    permissions:
      contents: read
      # paths-filter lists a pull request's files through the API.
      pull-requests: read
    outputs:
      services: ${{ steps.services.outputs.list }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      # Each filter is named after the image it builds. A change to this workflow
      # rebuilds every image, so the change is tested.
      - name: Detect changed files
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        if: github.ref_type == 'branch'
        id: changes
        with:
          filters: |
            smtp:
              - 'services/smtp/**'
              - '.github/workflows/build-and-push-images.yml'
            dkim:
              - 'services/dkim/**'
              - '.github/workflows/build-and-push-images.yml'
            certbot:
              - 'services/certbot/**'
              - '.github/workflows/build-and-push-images.yml'
            metadata-service:
              - 'services/metadata-service/**'
              - '.github/workflows/build-and-push-images.yml'

      # A release tag builds every image. Otherwise, only the changed ones.
      - name: List the images to build
        id: services
        env:
          CHANGED: ${{ steps.changes.outputs.changes }}
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            echo 'list=["smtp","dkim","certbot","metadata-service"]' >> "$GITHUB_OUTPUT"
          else
            echo "list=${CHANGED:-[]}" >> "$GITHUB_OUTPUT"
          fi

  build:
    name: build-${{ matrix.service }}
    needs: detect-changes
    if: needs.detect-changes.outputs.services != '' && needs.detect-changes.outputs.services != '[]'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJSON(needs.detect-changes.outputs.services) }}
    env:
      # smtp and dkim build from services/ and copy from their own folder in it.
      CONTEXT: ${{ (matrix.service == 'smtp' || matrix.service == 'dkim') && 'services' || format('services/{0}', matrix.service) }}
      SCAN_TAG: local/opengovmail-${{ matrix.service }}:scan
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-${{ matrix.service }}
          # latest follows main only, not every release tag.
          flavor: latest=false
          tags: |
            type=ref,event=branch
            type=sha,prefix={{branch}}-,enable=${{ github.ref_type == 'branch' && github.event_name != 'pull_request' }}
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=raw,value=latest,enable={{is_default_branch}}

      # Build into the local Docker daemon first, so the image is scanned before
      # anything is pushed.
      - name: Build Docker image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ env.CONTEXT }}
          file: services/${{ matrix.service }}/Dockerfile
          load: true
          tags: ${{ env.SCAN_TAG }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha

      # Fails on a CRITICAL vulnerability that has a fix, which stops the push.
      # Accept a finding by adding it to .trivyignore with a reason and an expiry date.
      - name: Scan the image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: 'image'
          image-ref: ${{ env.SCAN_TAG }}
          scanners: 'vuln'
          ignore-unfixed: true
          severity: 'CRITICAL'
          format: 'table'
          exit-code: '1'

      # Reuses the layers built above. Only main and tags write the cache, so pull
      # requests don't evict it.
      - name: Push Docker image
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ env.CONTEXT }}
          file: services/${{ matrix.service }}/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

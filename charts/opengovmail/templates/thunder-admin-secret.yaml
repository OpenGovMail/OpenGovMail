{{- if .Values.thunderid.enabled }}
{{- /*
Thunder admin credential. Two components read it: raven (IDP_SYSTEM_PASSWORD, for
OU->domain resolution during login) and the Thunder setup job
(THUNDER_ADMIN_PASSWORD, to create the admin user during bootstrap). Both are
secretKeyRefs with optional:false, so a missing Secret aborts the install.

Must be a pre-install hook with a weight below the setup job's -5, otherwise the
job's hook pod starts before this Secret exists. Hook/weight/delete-policy mirror
the subchart's own <release>-db-credentials Secret so the two behave alike.

Password precedence: an explicit global.thunderAdmin.password wins; otherwise the
value already in the cluster is reused (so upgrades and reinstalls do NOT rotate a
password Thunder has already bootstrapped against); otherwise one is generated.

⚠️  `lookup` returns nothing when there is no cluster connection, so
`helm template` / `--dry-run` renders a FRESH random password every time. Piping
that into `kubectl apply` against a live release rotates the credential and breaks
login for an already-bootstrapped Thunder. Set global.thunderAdmin.password
explicitly for any render-then-apply (GitOps) workflow.
*/}}
{{- $admin := .Values.global.thunderAdmin | default dict }}
{{- $name := required "global.thunderAdmin.secretName is required when thunderid.enabled" $admin.secretName }}
{{- $key := $admin.secretKey | default "password" }}

{{- /* The Secret is useless if its consumers look for a different name. Values files
     can't be templated, so these are separate literals — check them instead of
     letting a mismatch surface as a pod stuck in CreateContainerConfigError. */}}
{{- $adminRef := (((.Values.thunderid).setup).admin).passwordRef | default dict }}
{{- if and $adminRef.name (ne $adminRef.name $name) }}
  {{- fail (printf "thunderid.setup.admin.passwordRef.name (%s) must equal global.thunderAdmin.secretName (%s)" $adminRef.name $name) }}
{{- end }}
{{- if and $adminRef.key (ne $adminRef.key $key) }}
  {{- fail (printf "thunderid.setup.admin.passwordRef.key (%s) must equal global.thunderAdmin.secretKey (%s)" $adminRef.key $key) }}
{{- end }}

{{- $password := "" }}
{{- if $admin.password }}
  {{- $password = $admin.password }}
{{- else }}
  {{- $existing := lookup "v1" "Secret" .Release.Namespace $name }}
  {{- $existingData := dict }}
  {{- if $existing }}
    {{- $existingData = $existing.data | default dict }}
  {{- end }}
  {{- if index $existingData $key }}
    {{- $password = index $existingData $key | b64dec }}
  {{- else }}
    {{- $password = randAlphaNum 32 }}
  {{- end }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "opengovmail.labels" . | nindent 4 }}
    app.kubernetes.io/component: thunder-admin-credentials
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    # Below the setup job's -5 so the credential exists before the job reads it.
    "helm.sh/hook-weight": "-6"
    # Lets a reinstall recreate it instead of failing "already exists". The
    # password is read by `lookup` at render time, before this delete runs, so
    # recreating preserves the existing value.
    "helm.sh/hook-delete-policy": before-hook-creation
type: Opaque
data:
  {{ $key }}: {{ $password | b64enc | quote }}
{{- end }}

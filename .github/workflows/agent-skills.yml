name: Agent Skills

on:
  push:
    branches: [ main ]
    paths: [ '.agents/skills/**', '.claude/skills', '.github/workflows/agent-skills.yml' ]
  pull_request:
    paths: [ '.agents/skills/**', '.claude/skills', '.github/workflows/agent-skills.yml' ]

permissions:
  contents: read

jobs:
  validate:
    name: Validate skills
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'

      # skills-ref is the Agent Skills reference validator. It isn't on PyPI,
      # so install it from a pinned commit.
      - name: Install skills-ref
        run: pip install "git+https://github.com/agentskills/agentskills@f130f348f502d9804278a617f86929846896d2e9#subdirectory=skills-ref"

      - name: Validate every skill
        run: |
          status=0
          for dir in .agents/skills/*/; do
            echo "::group::${dir}"
            skills-ref validate "$dir" || status=1
            echo "::endgroup::"
          done
          exit $status

      # Claude Code reads .claude/skills; every other agent reads .agents/skills.
      - name: Check the .claude/skills symlink
        run: |
          test -L .claude/skills
          test "$(readlink .claude/skills)" = "../.agents/skills"

apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "unbound.fullname" . }}-config
  labels:
    {{- include "unbound.labels" . | nindent 4 }}
data:
  unbound.conf: |
    {{- required "unbound.configuration is required: the image's own config needs root, and this chart runs Unbound as non-root" .Values.configuration | nindent 4 }}

{{- /*
Render-time consistency guard. Emits no Kubernetes object — it exists purely to
turn a silently-wrong deployment into a loud render error.

Why this is needed. Every value the umbrella owns derives from global.domain via
a helper, but the three values below are consumed by the VENDORED Thunder
subchart, which knows nothing about global.domain. Helm values files cannot be
templated, so they have to be written as literals. Left unchecked, installing
with a different global.domain produces a Thunder that publishes someone else's
issuer URL: pods start, `helm lint` passes, and the breakage only surfaces at
first login as an OAuth issuer/redirect-URI mismatch.

This mirrors templates/thunder-admin-secret.yaml, which already fails the render
when the three hand-written admin Secret-name literals diverge. Same idea, same
reason: a literal that MUST track a derived value is guarded, not hoped over.

Delete this file once the values it guards can be derived — the thunderid chart
migration is where that becomes possible (see charts/PLAN.md).
*/}}
{{- if .Values.thunderid.enabled }}
{{- $domain := include "opengovmail.domain" . }}
{{- $expectedUrl := printf "https://%s:8090" $domain }}

{{- $publicUrl := (((.Values.thunderid).configuration).server).publicUrl }}
{{- if and $publicUrl (ne $publicUrl $expectedUrl) }}
  {{- fail (printf "thunderid.configuration.server.publicUrl (%s) does not match global.domain (%s). It becomes the JWT issuer, so it must be %s. Fix with:\n  --set thunderid.configuration.server.publicUrl=%s" $publicUrl $domain $expectedUrl $expectedUrl) }}
{{- end }}

{{- $gateHost := (((.Values.thunderid).configuration).gateClient).hostname }}
{{- if and $gateHost (ne $gateHost $domain) }}
  {{- fail (printf "thunderid.configuration.gateClient.hostname (%s) does not match global.domain (%s). Fix with:\n  --set thunderid.configuration.gateClient.hostname=%s" $gateHost $domain $domain) }}
{{- end }}

{{- /* The Direct Auth Secret gates the password-check endpoint raven calls. It has to
     be written twice — once for ThunderID's own config file, once for the Secret raven
     reads — because Helm cannot template a values file, and the subchart takes this
     value literally. Diverge and every mail login fails with 401, with nothing in the
     render to hint why.

     Compared against the value raven's Secret actually gets, not the raw global
     value: on an upgrade that omits the flag, the Secret keeps the value already in
     the cluster while ThunderID's copy would silently become empty. */}}
{{- if .Values.raven.enabled }}
{{- $chartSecret := ((((.Values.thunderid).configuration).server).security).directAuthSecret | default "" }}
{{- $ravenSecret := include "opengovmail.ravenDirectAuthSecret" . }}
{{- if ne $chartSecret $ravenSecret }}
  {{- fail (printf "thunderid.configuration.server.security.directAuthSecret does not match the Direct Auth Secret raven will use. ThunderID and raven must agree on the secret gating the password-check endpoint, or every mail login fails with 401. Pass the same value twice:\n  --set global.ravenIdp.directAuthSecret=$SECRET \\\n  --set thunderid.configuration.server.security.directAuthSecret=$SECRET\nOn an upgrade, reuse the value already in the cluster:\n  kubectl get secret %s -n %s -o jsonpath='{.data.directAuthSecret}' | base64 -d" .Values.global.ravenIdp.secretName .Release.Namespace) }}
{{- end }}
{{- end }}
{{- end }}

apiVersion: v1
kind: Secret
metadata:
  name: {{ include "opendkim.fullname" . }}-opengovmail
  labels:
    {{- include "opendkim.labels" . | nindent 4 }}
type: Opaque
stringData:
  # Drives key GENERATION. Must list exactly the domains configmap-tables.yaml
  # signs for, so both read the same opendkim.domains helper — otherwise keys get
  # generated for one domain and the SigningTable looks for another.
  opengovmail.yaml: |
    domains:
{{- range include "opendkim.domains" . | fromJsonArray }}
      - domain: {{ .domain | quote }}
        dkim-selector: {{ default "mail" .dkimSelector | quote }}
        dkim-key-size: {{ default 2048 .dkimKeySize }}
{{- end }}

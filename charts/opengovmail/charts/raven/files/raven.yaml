domain: {{ include "raven.domain" . }}
auth_server_url: https://{{ include "raven.thunderHost" . }}:{{ include "raven.thunderPort" . }}/auth/credentials/authenticate

# OAUTHBEARER token validation (RFC 7628). iss must match this public host.
{{- /* No :443, or iss would not match the token's https://host. */}}
{{- $issuer := printf "https://%s" (include "raven.thunderPublicHost" .) }}
{{- $publicPort := include "raven.thunderPublicPort" . }}
{{- if ne $publicPort "443" }}{{ $issuer = printf "%s:%s" $issuer $publicPort }}{{ end }}
oauth_issuer_url: "{{ $issuer }}"
oauth_jwks_url: "{{ $issuer }}/oauth2/jwks"
oauth_audience:
  - "{{ .Values.thunder.audience }}"
oauth_clock_skew_seconds: 60

# S3-Compatible Blob Storage Configuration
blob_storage:
{{- if .Values.blobStorage.enabled }}
  enabled: true
  endpoint: "{{ include "raven.s3Endpoint" . }}"
  region: "{{ .Values.blobStorage.region }}"
  bucket: "{{ .Values.blobStorage.bucket }}"
  access_key: "{{ include "raven.s3AccessKey" . }}"
  secret_key: "{{ include "raven.s3SecretKey" . }}"
  timeout: 30
{{- else }}
  enabled: false
{{- end }}

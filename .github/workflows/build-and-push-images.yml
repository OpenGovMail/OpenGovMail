name: Build and Push Docker Images

on:
  push:
    branches:
      - main
    # A release tag (v0.4.0) builds every image as 0.4.0. Not v.0.4.0: semver can't parse it.
    tags:
      - 'v[0-9]*'
  # Pull requests build the changed images to catch a broken Dockerfile before
  # it merges, but never log in or push.
  pull_request:
    paths:
      - 'services/**'
      - '.github/workflows/build-and-push-images.yml'
  workflow_dispatch:

# A new push to a pull request cancels its build in progress.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: OpenGovMail/opengovmail

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    if: github.repository == 'OpenGovMail/OpenGovMail'
    permissions:
      contents: read
      # paths-filter lists a pull request's files through the API.
      pull-requests: read
    outputs:
      smtp: ${{ steps.changes.outputs.smtp }}
      imap: ${{ steps.changes.outputs.imap }}
      dkim: ${{ steps.changes.outputs.dkim }}
      certbot: ${{ steps.changes.outputs.certbot }}
      metadata: ${{ steps.changes.outputs.metadata }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Detect changed files
        uses: dorny/paths-filter@v4
        if: github.ref_type == 'branch'
        id: changes
        with:
          filters: |
            smtp:
              - 'services/smtp/**'
              - '.github/workflows/build-and-push-images.yml'
            imap:
              - 'services/imap/**'
            dkim:
              - 'services/dkim/**'
              - '.github/workflows/build-and-push-images.yml'
            certbot:
              - 'services/certbot/**'
              - '.github/workflows/build-and-push-images.yml'
            metadata:
              - 'services/metadata-service/**'
              - '.github/workflows/build-and-push-images.yml'

  build-smtp:
    needs: detect-changes
    if: github.ref_type == 'tag' || needs.detect-changes.outputs.smtp == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-smtp
          # latest follows main only, not every release tag.
          flavor: latest=false
          tags: |
            type=ref,event=branch
            type=sha,prefix={{branch}}-,enable=${{ github.ref_type == 'branch' && github.event_name != 'pull_request' }}
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: services
          file: services/smtp/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          # Only main and tags write the cache, so pull requests don't evict it.
          cache-to: ${{ github.event_name != 'pull_request' && 'type=gha,mode=max' || '' }}

  build-dkim:
    needs: detect-changes
    if: github.ref_type == 'tag' || needs.detect-changes.outputs.dkim == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-dkim
          # latest follows main only, not every release tag.
          flavor: latest=false
          tags: |
            type=ref,event=branch
            type=sha,prefix={{branch}}-,enable=${{ github.ref_type == 'branch' && github.event_name != 'pull_request' }}
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: services
          file: services/dkim/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          # Only main and tags write the cache, so pull requests don't evict it.
          cache-to: ${{ github.event_name != 'pull_request' && 'type=gha,mode=max' || '' }}

  build-certbot:
    needs: detect-changes
    if: github.ref_type == 'tag' || needs.detect-changes.outputs.certbot == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-certbot
          # latest follows main only, not every release tag.
          flavor: latest=false
          tags: |
            type=ref,event=branch
            type=sha,prefix={{branch}}-,enable=${{ github.ref_type == 'branch' && github.event_name != 'pull_request' }}
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: services/certbot
          file: services/certbot/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          # Only main and tags write the cache, so pull requests don't evict it.
          cache-to: ${{ github.event_name != 'pull_request' && 'type=gha,mode=max' || '' }}

  build-metadata:
    needs: detect-changes
    if: github.ref_type == 'tag' || needs.detect-changes.outputs.metadata == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-metadata-service
          # latest follows main only, not every release tag.
          flavor: latest=false
          tags: |
            type=ref,event=branch
            type=sha,prefix={{branch}}-,enable=${{ github.ref_type == 'branch' && github.event_name != 'pull_request' }}
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: services/metadata-service
          file: services/metadata-service/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          # Only main and tags write the cache, so pull requests don't evict it.
          cache-to: ${{ github.event_name != 'pull_request' && 'type=gha,mode=max' || '' }}

{{- if .Values.thunderid.enabled }}
{{- /*
ThunderID bootstrap data: the mail domain's organization units, a user type for it,
raven's service account and the role granting it the system permission, and the
application mail clients authenticate against. Sourced from
charts/opengovmail/files/thunderid-bootstrap/. The setup job mounts it into
/opt/thunderid/bootstrap and applies it alongside the image's own defaults. Must be a
hook with weight < the setup-job's -5 so it exists before the setup-job pod starts;
a plain resource would be created after the hook and the job would fail.

Rendered through `tpl` rather than copied verbatim, because raven's client secret is
generated at render time and has to appear both here — where the application is
defined — and in the Secret raven reads.

The name is read from thunder.bootstrap.configMap.name — the same value the subchart
uses to mount it — so the two cannot disagree. Do NOT hardcode a name here: values
files can't be templated, so a literal on this side has to be kept in sync by hand
and silently breaks under a different release name.

pre-upgrade is included so edits to the scripts actually reach the cluster: helm
never re-runs a pre-install-only hook on upgrade, which would freeze this ConfigMap
at whatever the first install rendered. before-hook-creation makes reinstall (and
the pre-upgrade refresh) idempotent instead of failing "already exists". Nothing
reads the ConfigMap during an upgrade — the setup-job is pre-install only — so the
delete/recreate window is safe.
*/}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ required "thunderid.bootstrap.configMap.name is required when thunderid.enabled" .Values.thunderid.bootstrap.configMap.name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "opengovmail.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-12"
    "helm.sh/hook-delete-policy": before-hook-creation
data:
{{- range $path, $_ := .Files.Glob "files/thunderid-bootstrap/*.yaml" }}
  {{ base $path }}: |
{{ tpl ($.Files.Get $path) $ | indent 4 }}
{{- end }}
{{- end }}

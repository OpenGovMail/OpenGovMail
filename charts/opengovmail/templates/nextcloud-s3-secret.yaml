{{- if .Values.nextcloud.enabled }}
{{- /*
Nextcloud's S3 storage settings, read through nextcloud.nextcloud.objectStore.s3.existingSecret.
They come from the seaweedfs.s3.additionalIdentities entry named nextcloud; an empty
secretKey is derived exactly as the seaweedfs chart derives it.
*/}}
{{- $id := dict }}
{{- range ((.Values.seaweedfs).s3).additionalIdentities | default list }}
{{- if eq .name "nextcloud" }}{{ $id = . }}{{ end }}
{{- end }}
{{- if not (and .Values.seaweedfs.enabled $id.name) }}
{{- fail "nextcloud.enabled needs seaweedfs.enabled and a seaweedfs.s3.additionalIdentities entry named nextcloud for its files." }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: nextcloud-s3
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "opengovmail.labels" . | nindent 4 }}
    app.kubernetes.io/component: nextcloud-s3
type: Opaque
stringData:
  host: {{ ((.Values.global).serviceNames).s3 | default "seaweedfs-s3" | quote }}
  bucket: {{ $id.bucket | quote }}
  accessKey: {{ $id.accessKey | quote }}
  secretKey: {{ $id.secretKey | default (printf "%s-opengovmail-seaweedfs-s3-%s" .Release.Name $id.name | sha256sum | trunc 40) | quote }}
{{- end }}

name: Helm Chart

on:
  push:
    branches: [ main ]
    paths: [ 'charts/**', '.github/workflows/helm-chart.yml' ]
  pull_request:
    paths: [ 'charts/**', '.github/workflows/helm-chart.yml' ]

permissions:
  contents: read

jobs:
  render:
    name: Lint and render
    runs-on: ubuntu-latest
    env:
      CHART: charts/opengovmail
      # Placeholders for the secrets a first install requires.
      SECRETS: >-
        --set global.ravenIdp.clientSecret=ci
        --set global.ravenIdp.directAuthSecret=ci
        --set thunderid.configuration.server.security.directAuthSecret=ci

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Helm is preinstalled on the runner.
      - name: Fetch chart dependencies
        run: |
          helm repo add nextcloud https://nextcloud.github.io/helm/
          helm dependency build "$CHART"

      - name: Lint
        run: |
          # SECRETS holds several --set flags and is split into words on purpose.
          # shellcheck disable=SC2086
          helm lint "$CHART" -f "$CHART/values-example.yaml" $SECRETS

      - name: Render example values
        run: |
          # SECRETS holds several --set flags and is split into words on purpose.
          # shellcheck disable=SC2086
          helm template ci "$CHART" -f "$CHART/values-example.yaml" $SECRETS > /dev/null

      - name: Render default values
        run: |
          # SECRETS holds several --set flags and is split into words on purpose.
          # shellcheck disable=SC2086
          helm template ci "$CHART" --set global.domain=example.com $SECRETS > /dev/null

      # ClamAV is off by default and in the example values, so it gets a case of
      # its own, with Rspamd and the services Rspamd needs.
      - name: Render with ClamAV
        run: |
          # SECRETS holds several --set flags and is split into words on purpose.
          # shellcheck disable=SC2086
          helm template ci "$CHART" -f "$CHART/values-example.yaml" $SECRETS \
            --set rspamd.enabled=true --set redis.enabled=true \
            --set unbound.enabled=true --set clamav.enabled=true > /dev/null

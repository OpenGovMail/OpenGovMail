{{- /*
Render-time consistency guard. Emits no Kubernetes object — it exists purely to
turn a silently-wrong deployment into a loud render error.

Why this is needed. Every value the umbrella owns derives from global.domain via
a helper, but the three values below are consumed by the VENDORED Thunder
subchart, which knows nothing about global.domain. Helm values files cannot be
templated, so they have to be written as literals. Left unchecked, installing
with a different global.domain produces a Thunder that publishes someone else's
issuer URL: pods start, `helm lint` passes, and the breakage only surfaces at
first login as an OAuth issuer/redirect-URI mismatch.

This mirrors templates/thunder-admin-secret.yaml, which already fails the render
when the three hand-written admin Secret-name literals diverge. Same idea, same
reason: a literal that MUST track a derived value is guarded, not hoped over.

Delete this file once the values it guards can be derived.
*/}}
{{- if .Values.thunderid.enabled }}
{{- /* ThunderID's bootstrap, including raven's service account, is applied only
     by its install-time setup job, and nothing migrates a Thunder 0.x database.
     Upgrading a release that still runs the old asgardeo Thunder chart would leave
     raven with no identity to authenticate as, so require a fresh namespace. */}}
{{- range ((lookup "apps/v1" "Deployment" .Release.Namespace "").items | default list) }}
  {{- if eq (index (.metadata.labels | default dict) "app.kubernetes.io/name" | default "") "thunder" }}
    {{- fail (printf "Deployment %s in namespace %s runs the old Thunder chart. ThunderID cannot be upgraded in place: its setup job, which registers raven's service account, only runs on a fresh install, and there is no migration from the Thunder 0.x database. Install into a new namespace instead." .metadata.name $.Release.Namespace) }}
  {{- end }}
{{- end }}
{{- $domain := include "opengovmail.domain" . }}
{{- $expectedUrl := printf "https://%s:8090" $domain }}

{{- $publicUrl := (((.Values.thunderid).configuration).server).publicUrl }}
{{- if and $publicUrl (ne $publicUrl $expectedUrl) }}
  {{- fail (printf "thunderid.configuration.server.publicUrl (%s) does not match global.domain (%s). It becomes the JWT issuer, so it must be %s. Fix with:\n  --set thunderid.configuration.server.publicUrl=%s" $publicUrl $domain $expectedUrl $expectedUrl) }}
{{- end }}

{{- $gateHost := (((.Values.thunderid).configuration).gateClient).hostname }}
{{- if and $gateHost (ne $gateHost $domain) }}
  {{- fail (printf "thunderid.configuration.gateClient.hostname (%s) does not match global.domain (%s). Fix with:\n  --set thunderid.configuration.gateClient.hostname=%s" $gateHost $domain $domain) }}
{{- end }}

{{- /* The Direct Auth Secret gates the password-check endpoint raven calls. It has to
     be written twice — once for ThunderID's own config file, once for the Secret raven
     reads — because Helm cannot template a values file, and the subchart takes this
     value literally. Diverge and every mail login fails with 401, with nothing in the
     render to hint why.

     Compared against the value raven's Secret actually gets, not the raw global
     value: on an upgrade that omits the flag, the Secret keeps the value already in
     the cluster while ThunderID's copy would silently become empty. */}}
{{- if .Values.raven.enabled }}
{{- $chartSecret := ((((.Values.thunderid).configuration).server).security).directAuthSecret | default "" }}
{{- $ravenSecret := include "opengovmail.ravenDirectAuthSecret" . }}
{{- if ne $chartSecret $ravenSecret }}
  {{- fail (printf "thunderid.configuration.server.security.directAuthSecret does not match the Direct Auth Secret raven will use. ThunderID and raven must agree on the secret gating the password-check endpoint, or every mail login fails with 401. Pass the same value twice:\n  --set global.ravenIdp.directAuthSecret=$SECRET \\\n  --set thunderid.configuration.server.security.directAuthSecret=$SECRET\nOn an upgrade, reuse the value already in the cluster:\n  kubectl get secret %s -n %s -o jsonpath='{.data.directAuthSecret}' | base64 -d" .Values.global.ravenIdp.secretName .Release.Namespace) }}
{{- end }}
{{- end }}
{{- end }}

{{- /* One ThunderID or the other: with both, sign-in splits across two servers. */}}
{{- with ((.Values.global).thunder).url }}
{{- if $.Values.thunderid.enabled }}
  {{- fail (printf "global.thunder.url (%s) points at an external ThunderID, so set thunderid.enabled=false." .) }}
{{- end }}
{{- if not (hasPrefix "https://" .) }}
  {{- fail (printf "global.thunder.url (%s) must start with https://." .) }}
{{- end }}
{{- /* raven builds its URLs from host and port only, so a path would be dropped. */}}
{{- $u := urlParse . }}
{{- if or (ne (trimSuffix "/" $u.path) "") $u.query $u.fragment }}
  {{- fail (printf "global.thunder.url (%s) must be just https://host[:port], with no path, query or fragment." .) }}
{{- end }}
{{- end }}

{{- /* Nextcloud's Secret names are written twice: once by our templates, once in the
     vendored chart's values, which Helm will not template. Check rather than hope. */}}
{{- if .Values.nextcloud.enabled }}
{{- if not (or .Values.thunderid.enabled (((.Values.global).thunder).url)) }}
  {{- fail "nextcloud.enabled needs a ThunderID to sign in through: set thunderid.enabled, or global.thunder.url for an external one." }}
{{- end }}
{{- if not (or .Values.thunderid.enabled .Values.raven.enabled) }}
  {{- fail (printf "nextcloud.enabled needs raven.enabled: Nextcloud registers with ThunderID using raven's credentials, and Secret %s is only created with raven or the bundled ThunderID." .Values.global.ravenIdp.secretName) }}
{{- end }}
{{- $pgSecret := .Values.nextcloudDeps.postgres.secretName }}
{{- $ncPgSecret := ((((.Values.nextcloud).externalDatabase).existingSecret).secretName) }}
{{- if and $ncPgSecret (ne $ncPgSecret $pgSecret) }}
  {{- fail (printf "nextcloud.externalDatabase.existingSecret.secretName (%s) must equal nextcloudDeps.postgres.secretName (%s), or Nextcloud reads a Secret that does not exist." $ncPgSecret $pgSecret) }}
{{- end }}
{{- $idpSecret := .Values.nextcloudDeps.idpSecretName }}
{{- range (((.Values.nextcloud).nextcloud).extraEnv | default list) }}
  {{- $ref := ((.valueFrom).secretKeyRef).name | default "" }}
  {{- if and $ref (hasPrefix "OIDC_" (.name | default "")) (ne $ref $idpSecret) }}
    {{- fail (printf "nextcloud.nextcloud.extraEnv %s reads Secret %s, but nextcloudDeps.idpSecretName is %s." .name $ref $idpSecret) }}
  {{- end }}
{{- end }}
{{- end }}

{{- /* Nextcloud fetches ThunderID's OIDC discovery with certificate verification on.
     ThunderID generates a self-signed CN=localhost cert unless pointed elsewhere, so
     without this the registration Job fails and the install never completes. */}}
{{- if and .Values.nextcloud.enabled .Values.thunderid.enabled }}
{{- $certFile := ((((.Values.thunderid).configuration).tls).certFile) | default "" }}
{{- $mountSecret := ((((.Values.thunderid).declarativeResources).secret).name) | default "" }}
{{- if or (hasPrefix "config/certs/" $certFile) (not $mountSecret) }}
  {{- fail (printf "Nextcloud needs ThunderID to serve a trusted certificate, but ThunderID is still using its self-signed one. Mount the cert-manager Secret (%s) and point ThunderID at it. See values-example.yaml for the full block:\n  --set thunderid.configuration.tls.certFile=config/tls/server.cert\n  --set thunderid.configuration.tls.keyFile=config/tls/server.key\n  --set thunderid.declarativeResources.enabled=true\n  --set thunderid.declarativeResources.secret.name=%s" (include "opengovmail.domain" . | replace "." "-" | printf "%s-tls") (include "opengovmail.domain" . | replace "." "-" | printf "%s-tls")) }}
{{- end }}
{{- end }}

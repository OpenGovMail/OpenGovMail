apiVersion: v1
kind: Pod
metadata:
  name: "{{ include "clamav.fullname" . }}-test"
  labels:
    {{- include "clamav.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": test
spec:
  securityContext:
    runAsUser: 65534
    runAsNonRoot: true
  containers:
    - name: clamd-ping
      image: "{{ .Values.initContainer.image.repository }}:{{ .Values.initContainer.image.tag }}"
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop:
            - ALL
      command:
        - sh
        - -c
        # clamd answers PONG to PING over its TCP port.
        - printf 'zPING\0' | nc -w5 {{ include "clamav.serviceName" . }} {{ .Values.service.port }} | grep -q PONG
  restartPolicy: Never

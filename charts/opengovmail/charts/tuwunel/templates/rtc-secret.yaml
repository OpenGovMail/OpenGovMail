{{- if and .Values.matrixRtc.enabled (not .Values.matrixRtc.existingSecret) }}
{{- /*
LiveKit API key and secret, shared by LiveKit and lk-jwt-service. Generated on
first install and read back on every upgrade, so the pair never changes under a
running deployment. lookup sees nothing under helm template, which therefore
renders a new pair each time; use existingSecret there.
*/}}
{{- $name := include "tuwunel.rtcSecretName" . }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name | default dict }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "tuwunel.labels" . | nindent 4 }}
    app.kubernetes.io/component: rtc
type: Opaque
data:
  apiKey: {{ dig "data" "apiKey" (randAlphaNum 20 | b64enc) $existing | quote }}
  # LiveKit refuses secrets shorter than 32 characters.
  apiSecret: {{ dig "data" "apiSecret" (randAlphaNum 64 | b64enc) $existing | quote }}
{{- end }}

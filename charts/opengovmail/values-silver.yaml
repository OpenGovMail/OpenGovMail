# Deployment values for silver.opensource.lk (single-node k3s, 187.127.207.101).
# Secrets are NOT here. Pass them with --set, or a separate uncommitted file.

global:
  domain: silver.opensource.lk
  tls:
    # Production, not the chart's le-staging default: Nextcloud must trust
    # ThunderID's certificate to fetch its OIDC discovery document.
    issuer: le-prod

raven:
  image:
    tag: dev

thunderid:
  configuration:
    server:
      publicUrl: https://silver.opensource.lk:8090
    gateClient:
      hostname: silver.opensource.lk
    tls:
      # Points at the cert-manager certificate mounted below, replacing the
      # self-signed CN=localhost cert the setup job generates.
      certFile: config/tls/server.cert
      keyFile: config/tls/server.key

  # The only mount the chart exposes on the running pod, so it carries the real
  # certificate. Secret name is the bare domain dotted-to-dashed, per
  # templates/certificate.yaml.
  declarativeResources:
    enabled: true
    readOnly: true
    secret:
      name: silver-opensource-lk-tls
      items:
        - key: tls.crt
          mountPath: /opt/thunderid/config/tls/server.cert
        - key: tls.key
          mountPath: /opt/thunderid/config/tls/server.key

nextcloud:
  enabled: true
  nextcloud:
    # nip.io resolves to the node, so no DNS record is needed to test.
    host: cloud.187.127.207.101.nip.io
    mail:
      domain: silver.opensource.lk
  ingress:
    tls:
      - secretName: nextcloud-tls
        hosts:
          - cloud.187.127.207.101.nip.io

replicaCount: 1

image:
  # A distroless image, kept up to date with Unbound releases, that needs no
  # root: its config and data folders belong to the unbound user (101:102).
  repository: klutchell/unbound
  tag: "1.26.2"
  pullPolicy: IfNotPresent

imagePullSecrets: []

nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  annotations: {}
  name: ""

podAnnotations: {}

# Unbound runs as the image's unbound user from the start, with no
# capabilities. The sysctl lets that non-root user bind port 53; Kubernetes
# treats it as a safe, pod-scoped sysctl, so no node setting is needed.
podSecurityContext:
  runAsUser: 101
  runAsGroup: 102
  runAsNonRoot: true
  fsGroup: 102
  fsGroupChangePolicy: OnRootMismatch
  seccompProfile:
    type: RuntimeDefault
  sysctls:
    - name: net.ipv4.ip_unprivileged_port_start
      value: "53"

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
  # Unbound rewrites /var/unbound/root.key when the DNSSEC root key rolls over.
  readOnlyRootFilesystem: false

service:
  type: ClusterIP
  port: 53
  targetPort: 53
  protocol: UDP
  annotations: {}

resources:
  limits:
    cpu: 500m
    memory: 256Mi
  requests:
    cpu: 100m
    memory: 64Mi

nodeSelector: {}

tolerations: []

affinity: {}

persistence:
  enabled: false
  storageClass: ""
  accessMode: ReadWriteOnce
  size: 512Mi
  mountPath: /var/lib/unbound

# unbound.conf, mounted over the image's own. Required: the image's default
# config switches to the unbound user itself, which only works when started as
# root. This one:
#   - resolves recursively from the root servers. Spamhaus, SURBL and other DNS
#     blocklists refuse queries that arrive through public resolvers, so
#     forwarding would make rspamd's RBL checks silently return nothing.
#   - sizes its caches to fit resources.limits.memory.
#   - runs without chroot or a user switch, as the non-root user it starts as.
configuration: |
  server:
    interface: 0.0.0.0@53
    port: 53
    do-ip4: yes
    do-ip6: no            # pod networks are usually IPv4-only
    do-udp: yes
    do-tcp: yes

    # Only cluster-internal clients.
    access-control: 0.0.0.0/0 refuse
    access-control: 127.0.0.0/8 allow
    access-control: 10.0.0.0/8 allow
    access-control: 172.16.0.0/12 allow
    access-control: 192.168.0.0/16 allow

    # Already the unbound user: no chroot and no user switch. /var/unbound
    # belongs to that user and holds the image's root hints and DNSSEC trust
    # anchor, which Unbound keeps up to date.
    do-daemonize: no
    directory: "/var/unbound"
    chroot: ""
    username: ""
    pidfile: ""
    root-hints: "/var/unbound/root.hints"
    auto-trust-anchor-file: "/var/unbound/root.key"

    # Logs to stderr (kubectl logs).
    use-syslog: no
    logfile: ""
    verbosity: 1
    log-servfail: yes

    # Sized for a 256Mi limit: rrset ~2x msg, total well under the limit.
    num-threads: 2
    msg-cache-slabs: 2
    rrset-cache-slabs: 2
    infra-cache-slabs: 2
    key-cache-slabs: 2
    msg-cache-size: 32m
    rrset-cache-size: 64m
    key-cache-size: 16m
    neg-cache-size: 4m
    so-reuseport: yes
    # The system's socket buffer size; a larger one needs root to request.
    so-sndbuf: 0
    outgoing-range: 4096
    num-queries-per-thread: 2048

    # Blocklist answers are short-lived and must not be stretched or served stale.
    cache-min-ttl: 0
    serve-expired: no
    prefetch: yes
    prefetch-key: yes

    edns-buffer-size: 1232
    qname-minimisation: yes
    harden-glue: yes
    harden-dnssec-stripped: yes
    harden-below-nxdomain: yes
    hide-identity: yes
    hide-version: yes

  remote-control:
    control-enable: no

livenessProbe:
  tcpSocket:
    port: 53
  initialDelaySeconds: 60
  periodSeconds: 30
  timeoutSeconds: 5
  failureThreshold: 3

readinessProbe:
  tcpSocket:
    port: 53
  initialDelaySeconds: 30
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 3

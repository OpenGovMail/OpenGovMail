{{- if .Values.nextcloud.enabled }}
{{- /*
Nextcloud's admin account. Replaces the vendored chart's default of admin/changeme.

The password is generated on first install and kept; see opengovmail.keptSecret.
The before-starting hook applies it on every start, so a new value needs only a restart.
*/}}
{{- $admin := .Values.nextcloudDeps.admin }}
{{- $es := .Values.nextcloud.nextcloud.existingSecret }}
{{- $smtp := .Values.nextcloud.nextcloud.mail.smtp }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $admin.secretName }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "opengovmail.labels" . | nindent 4 }}
    app.kubernetes.io/component: nextcloud-admin
  annotations:
    # Outlives uninstall like the volume, so a reinstall reuses the password.
    "helm.sh/resource-policy": keep
type: Opaque
data:
  {{ $es.usernameKey }}: {{ $admin.username | b64enc | quote }}
  {{ $es.passwordKey }}: {{ include "opengovmail.keptSecret" (dict "ctx" . "secret" $admin.secretName "key" $es.passwordKey "value" ($admin.password | default "") "flag" "nextcloudDeps.admin.password" "owner" "Nextcloud" "rotatable" true) | b64enc | quote }}
  # With existingSecret on, the vendored chart reads its SMTP settings from here too.
  {{ $es.smtpHostKey }}: {{ $smtp.host | b64enc | quote }}
  {{ $es.smtpUsernameKey }}: {{ $smtp.name | default "" | b64enc | quote }}
  {{ $es.smtpPasswordKey }}: {{ $smtp.password | default "" | b64enc | quote }}
{{- end }}

apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "raven.fullname" . }}
  labels:
    {{- include "raven.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  # Single writer to the RWO data PVC; never roll a second pod onto it.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "raven.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/secret-config.yaml") . | sha256sum }}
      {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "raven.selectorLabels" . | nindent 8 }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      initContainers:
        # Raven's DB_FILE lives under /app/data/databases; ensure the dir exists
        # on the fresh PVC (compose seeded it via a host script).
        - name: init-db-dir
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["/bin/sh", "-c", "mkdir -p {{ .Values.persistence.mountPath }}/databases"]
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: {{ .Values.persistence.mountPath }}
      containers:
        - name: raven
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            - name: DB_FILE
              value: {{ .Values.persistence.mountPath }}/databases/shared.db
            - name: SOCKETMAP_HOST
              value: "0.0.0.0"
            - name: SOCKETMAP_PORT
              value: {{ .Values.ports.socketmap | quote }}
            - name: THUNDER_HOST
              value: {{ include "raven.thunderHost" . | quote }}
            - name: THUNDER_PORT
              value: {{ .Values.thunder.port | quote }}
            {{- /* Only the OAuth token path uses this. Raven's administrative reads
                 no longer involve an application id at all. */}}
            {{- if .Values.thunder.applicationId }}
            - name: APPLICATION_ID
              value: {{ .Values.thunder.applicationId | quote }}
            {{- end }}
            {{- /* Raven authenticates to ThunderID as its own machine-to-machine
                 application, not as the admin user: only fullstack and custom apps
                 may start a login flow server-side, so the old route now answers 403.
                 IDP_DIRECT_AUTH_SECRET separately gates the password-check endpoint,
                 which answers 401 without it. */}}
            {{- if .Values.thunder.idpSecretName }}
            - name: IDP_CLIENT_ID
              value: {{ .Values.thunder.idpClientId | default "RAVEN_SYSTEM" | quote }}
            - name: IDP_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.thunder.idpSecretName }}
                  key: clientSecret
            - name: IDP_DIRECT_AUTH_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.thunder.idpSecretName }}
                  key: directAuthSecret
            {{- end }}
            {{- /* The System resource server's identifier, which ThunderID derives from
                 its own public URL. Raven defaults it to its own base URL plus /mcp,
                 which already matches while raven reaches ThunderID on the public
                 name. Set only if that stops being true. */}}
            {{- if .Values.thunder.resourceIdentifier }}
            - name: IDP_RESOURCE
              value: {{ .Values.thunder.resourceIdentifier | quote }}
            {{- end }}
            - name: CACHE_TTL_SECONDS
              value: {{ .Values.env.cacheTtlSeconds | quote }}
            - name: TOKEN_REFRESH_SECONDS
              value: {{ .Values.env.tokenRefreshSeconds | quote }}
          ports:
            # imap/imaps bind hostPort so external mail clients reach them on the
            # node IP (single-node, one pod per host port). Mirrors postfix.
            - name: imap
              containerPort: {{ .Values.ports.imap }}
              {{- if .Values.hostPort.enabled }}
              hostPort: {{ .Values.ports.imap }}
              {{- end }}
            - name: imaps
              containerPort: {{ .Values.ports.imaps }}
              {{- if .Values.hostPort.enabled }}
              hostPort: {{ .Values.ports.imaps }}
              {{- end }}
            - {name: lmtp,      containerPort: {{ .Values.ports.lmtp }}}
            - {name: sasl,      containerPort: {{ .Values.ports.sasl }}}
            - {name: socketmap, containerPort: {{ .Values.ports.socketmap }}}
          livenessProbe:
            {{- toYaml .Values.livenessProbe | nindent 12 }}
          readinessProbe:
            {{- toYaml .Values.readinessProbe | nindent 12 }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: {{ .Values.persistence.mountPath }}
            - name: config
              mountPath: /etc/raven
              readOnly: true
            {{- if .Values.tls.enabled }}
            - name: certs
              mountPath: {{ .Values.tls.mountPath }}
              readOnly: true
            {{- end }}
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: {{ include "raven.fullname" . }}-data
        - name: config
          secret:
            secretName: {{ include "raven.configSecretName" . }}
        {{- if .Values.tls.enabled }}
        - name: certs
          secret:
            secretName: {{ include "raven.certSecretName" . }}
            {{- if .Values.tls.certManagerKeys }}
            # Remap cert-manager's tls.crt/tls.key to the fullchain.pem/privkey.pem
            # filenames Raven expects, so a cert-manager Secret can be mounted directly
            # (auto-renews; no hand-copied secret).
            items:
              - key: tls.crt
                path: fullchain.pem
              - key: tls.key
                path: privkey.pem
            {{- end }}
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}

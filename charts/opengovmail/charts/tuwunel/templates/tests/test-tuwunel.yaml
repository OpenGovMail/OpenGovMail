apiVersion: v1
kind: Pod
metadata:
  name: {{ include "tuwunel.fullname" . }}-test
  labels:
    {{- include "tuwunel.labels" . | nindent 4 }}
    app.kubernetes.io/component: test
  annotations:
    "helm.sh/hook": test
    "helm.sh/hook-delete-policy": before-hook-creation
spec:
  restartPolicy: Never
  automountServiceAccountToken: false
  securityContext:
    runAsNonRoot: true
    runAsUser: 65534
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: test
      image: curlimages/curl:8.11.1
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop: ["ALL"]
      command: ["sh", "-c"]
      args:
        - |
          set -e
          base=http://{{ include "tuwunel.fullname" . }}:{{ .Values.service.port }}
          curl -fsS "$base/_matrix/client/versions" >/dev/null
          echo "client API answers"
          curl -fsS "$base/.well-known/matrix/client" | grep -q {{ include "tuwunel.host" . | quote }}
          echo "well-known points at {{ include "tuwunel.host" . }}"
          {{- if .Values.oidc.enabled }}
          curl -fsS "$base/_matrix/client/v3/login" | grep -q m.login.sso
          echo "SSO login offered"
          {{- end }}

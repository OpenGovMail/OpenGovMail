global:
  domain: ""                 # required; e.g. example.com. Everything derives from it.
  mailHostname: ""           # default mail.<domain>
  tlsSecretName: ""          # default mail-<domain>-tls (matches certificate.yaml naming)
  # Stable, release-independent Service names so vendored subchart configs resolve
  # in-cluster (postfix main.cf points at these). Each service chart must create a
  # Service with the matching name.
  serviceNames:
    raven: raven
    rspamd: rspamd
    opendkim: opendkim
    s3: seaweedfs-s3
    postfix: postfix
    thunderLb: thunder-lb
  # Thunder admin credential, created by templates/thunder-admin-secret.yaml and
  # read by BOTH raven (raven.thunder.systemPasswordSecret) and the Thunder setup
  # job (thunder.setup.secretEnv). This is the canonical name — the template fails
  # the render if either consumer's literal disagrees with it.
  #
  # password: leave empty to generate one on first install and reuse whatever is
  # already in the cluster thereafter (upgrades never rotate it). Set it
  # explicitly for GitOps / `helm template | kubectl apply`, where `lookup` can't
  # see the cluster and would otherwise emit a new random value each render.
  thunderAdmin:
    secretName: opengovmail-thunder-admin
    secretKey: password
    password: ""
  # Credentials raven uses against ThunderID, created by
  # templates/raven-idp-secret.yaml and read by the raven Deployment.
  #
  # Raven no longer logs in as the admin user: ThunderID only lets fullstack and
  # custom applications start a login flow server-side, and the Console app is a
  # browser app, so that route now answers 403. Raven authenticates as its own
  # machine-to-machine application instead. See charts/PLAN.md.
  #
  # clientSecret: generated on first install and reused thereafter, exactly like
  # the admin password above. The umbrella owns both ends — the bootstrap data
  # that defines the application, and the Secret raven reads — so nothing has to
  # be supplied by hand.
  #
  # directAuthSecret: MUST be supplied. It gates ThunderID's password-check
  # endpoint, and unlike the client secret it cannot be generated here: it has to
  # appear as a literal in the vendored subchart's own values, which Helm cannot
  # template. Set the same value in both places, or the render fails with a
  # message telling you so:
  #   --set global.ravenIdp.directAuthSecret=$SECRET \
  #   --set thunderid.configuration.server.security.directAuthSecret=$SECRET
  ravenIdp:
    secretName: opengovmail-raven-idp
    clientId: RAVEN_SYSTEM
    clientSecret: ""
    directAuthSecret: ""
  # Shared S3 credentials so seaweedfs (server) and raven (client) always agree.
  # secretKey "" => both charts DERIVE the same key from the release name
  # (deterministic, no cross-lookup) so a fresh one-command install matches out
  # of the box. Set a real secretKey in prod.
  s3:
    accessKey: raven
    secretKey: ""
    bucket: email-attachments
  imagePullSecrets: []
  # TLS lives under global so subcharts (postfix) can gate their config on it,
  # not just the umbrella's certificate.yaml.
  tls:
    enabled: true
    # Staging by default so a first install cannot burn the Let's Encrypt
    # production duplicate-certificate limit (5/week per identical name set, and
    # this chart issues two Certificates per install) while DNS and the HTTP-01
    # path are still being validated. Switch once `kubectl get certificate -n <ns>`
    # shows READY=True:
    #   --set global.tls.issuer=le-prod
    # Staging certs are NOT publicly trusted, so raven's JWKS fetch and mail-client
    # OAuth fail TLS verification until you do.
    issuer: le-staging
    renewBefore: "720h" # renew 30 days before expiry
    # Empty -> derives [ mail.<domain>, <domain> ] from global.domain, so the
    # cert Secret postfix mounts (opengovmail.tlsSecretName) always exists. Override
    # only to add extra SANs.
    domains: []
  # SASL auth is served by raven. Disable for a raven-less standalone bring-up
  # (postfix still accepts mail on 25; submission works without auth).
  sasl:
    enabled: true

opendkim:
  enabled: true

postfix:
  enabled: true

redis:
  enabled: false

unbound:
  enabled: false

rspamd:
  enabled: false

raven:
  enabled: true
  hostPort:
    enabled: true
  tls:
    # Empty -> the raven chart derives the cert-manager Secret from global.domain
    # (mail-<domain-dashed>-tls, the name templates/certificate.yaml mints).
    existingSecret: ""
    certManagerKeys: true
  thunder:
    # Empty -> both derive the BARE <global.domain>, overriding the raven chart's
    # in-cluster default.
    #
    # host feeds raven.yaml's auth_server_url (https://<host>:8090/auth/credentials/
    # authenticate) and publicHost feeds oauth_issuer_url / oauth_jwks_url. All three
    # are HTTPS, so the name must be one Thunder's certificate covers — and Thunder
    # serves the cert for the bare domain, not mail.<domain>. An in-cluster name
    # (opengovmail-thunder-service) is not a SAN on that cert either, and raven has no
    # skip-verify or custom-CA option, so neither can be used here.
    #
    # Consequence: raven's in-cluster calls resolve the public name to the node's
    # external IP and hairpin back through klipper/servicelb. Verified working on
    # single-node k3s, but it needs hairpin NAT to the node's external IP —
    # clusters/CNIs without it will fail with no in-cluster fallback.
    # Fixing this properly requires a TLS terminator that also carries an
    # in-cluster SAN; tracked with the Thunder cert-mount work.
    host: ""
    publicHost: ""
    # Application mail clients authenticate against. Pinned in the bootstrap data
    # (files/thunderid-bootstrap/), so unlike the old CONSOLE id it is a constant
    # and never needs reading back out of the database after an install.
    #
    # Only the OAuth token path uses it. Raven's administrative reads no longer
    # involve an application id at all.
    applicationId: "01900000-0000-7000-8000-0000000000c1"
    # Identity raven uses for its administrative reads (organization units, users,
    # groups). Both credentials come from the Secret templates/raven-idp-secret.yaml
    # creates; see global.ravenIdp for how each is obtained.
    #
    # This replaces the old admin username and password. ThunderID no longer lets a
    # background service log in as a person, and a password-check token carries no
    # permissions, so raven authenticates as its own machine-to-machine application.
    idpSecretName: opengovmail-raven-idp
    # The resource server raven asks its token for. Counter-intuitively this is
    # localhost and NOT the deployment's own URL: ThunderID's shipped defaults
    # register the System resource server with the literal identifier
    # https://localhost:8090/mcp, whatever public URL the server is configured with.
    #
    # Verified by reading /resource-servers back from a running install. Raven would
    # otherwise derive it from its own base URL, and the token request fails with
    # invalid_target — which names the resource parameter and gives no hint that the
    # registered identifier is a hardcoded localhost.
    resourceIdentifier: "https://localhost:8090/mcp"

seaweedfs:
  enabled: true
  s3:
    accessKey: raven
    secretKey: ""
    bucket: email-attachments
# ThunderID identity server: a SQLite database seeded from the image, a one-time
# setup job, and declarative bootstrap data.
#
# The server image tag is deliberately NOT pinned here — it defaults to the
# subchart's appVersion, so bumping the dependency version in Chart.yaml also
# moves the image. Pinning it here silently decouples the two.
#
# The bootstrap ConfigMap is rendered by the umbrella from
# files/thunderid-bootstrap/ (templates/thunder-bootstrap-configmap.yaml), so no
# out-of-band script is needed to create it.
thunderid:
  enabled: true

  deployment:
    # SQLite is single-writer, so run exactly one pod.
    replicaCount: 1
    securityContext:
      # 1.0.0-alpha2 dropped the "must be false when using sqlite" caveat from its
      # own values: the database now lives on a PVC at /opt/thunderid/database and
      # /tmp is an emptyDir, so nothing needs to write to the image filesystem.
      # Left false until a k3d run proves true works; flip it and delete this note.
      readOnlyRootFilesystem: false

  # A single SQLite pod cannot be horizontally scaled. The chart defaults HPA on
  # (min 1 / max 10); a 2nd pod sharing the one RWO PVC locks writes and breaks
  # user creation ("failed to create user"). Must stay off while on SQLite.
  hpa:
    enabled: false

  # Raven reaches ThunderID in-cluster on 8090. External access to the console and
  # gate UIs on 8090 comes from templates/thunder-lb.yaml, not from this ingress.
  ingress:
    enabled: false

  # SQLite requires a PVC. An init container seeds it from the image on first start.
  persistence:
    enabled: true
    size: 1Gi

  # New in this chart: the setup job generates this deployment's TLS, JWT-signing
  # and encryption keys onto their own volume, and the server reads them from it.
  # Nothing is baked into the image, so every install gets unique keys.
  #
  # Treat as persistent. Losing this volume invalidates every token ever issued and
  # makes previously encrypted data unreadable. The 16Mi defaults are plenty.
  certs:
    persistence:
      size: 16Mi
  # Runtime secrets the setup job generates. We set the Direct Auth Secret
  # explicitly (see global.ravenIdp), so this volume matters less, but the chart
  # still mounts it.
  secrets:
    persistence:
      size: 16Mi

  configuration:
    # Public URL the console/gate SPAs are served from and call back to.
    # Becomes the JWT issuer, so it must equal raven's oauth_issuer_url. Keep in
    # sync with setup.env THUNDER_PUBLIC_URL below, otherwise the CONSOLE app's
    # redirect URI won't match and OAuth login fails.
    server:
      publicUrl: ""
      # Gates the password-check endpoint raven calls; without it every login gets
      # 401. Must equal global.ravenIdp.directAuthSecret — templates/domain-guard.yaml
      # fails the render if they diverge. It cannot be derived from the global
      # value: Helm does not template values files, and the subchart writes this
      # straight into its config file.
      security:
        directAuthSecret: ""
    # gate UI is served by ThunderID on :8090 (via the thunder-lb), not :443.
    gateClient:
      hostname: ""
      port: 8090
    # Must match the app raven validates client tokens against (EMAIL_APP, per the
    # bootstrap data).
    jwt:
      audience: "EMAIL_APP"
    # Role names changed in this chart: runtime became runtime_transient, user
    # became entity, and runtime_persistent is new — it holds sessions, revoked
    # tokens and consent records, which used to be a separate consent database.
    database:
      config:
        type: "sqlite"
      runtime_transient:
        type: "sqlite"
      entity:
        type: "sqlite"
      runtime_persistent:
        type: "sqlite"

  # One-time initialization job. Runs on install only — it cannot re-run against a
  # database it has already bootstrapped, which is why changing the bootstrap data
  # means deleting the namespace rather than running an upgrade.
  setup:
    enabled: true
    # The consent server, which the old 768Mi bump existed to stop OOM-killing, is
    # gone in this chart — consent is built into the server now. Left generous
    # until a k3d run shows what the declarative bootstrap actually needs.
    resources:
      limits:
        cpu: 500m
        memory: 768Mi
      requests:
        cpu: 100m
        memory: 256Mi
    # Keeps the setup Job after it succeeds instead of deleting it immediately.
    # Without this its log is gone the moment it finishes, and a failed bootstrap
    # has to be diagnosed from the database. Turn off once this is stable.
    preserveJob: true
    # Structured admin block, replacing the environment-variable workaround. The
    # password comes from the Secret the umbrella creates
    # (templates/thunder-admin-secret.yaml), which raven no longer reads but the
    # console login still needs. Read the generated value with:
    #   kubectl get secret opengovmail-thunder-admin -n opengovmail \
    #     -o jsonpath='{.data.password}' | base64 -d
    admin:
      username: "admin"
      passwordRef:
        name: opengovmail-thunder-admin
        key: password

  # Bootstrap data, delivered via the ConfigMap the umbrella renders from
  # files/thunderid-bootstrap/. Declarative YAML now, not shell: roughly 1,900
  # lines of script became one file, because upstream's own defaults already
  # create the default organization unit, user types, flows, roles, themes and the
  # console application, all with fixed ids. We add only what they lack.
  #
  # Listing the file mounts just it, leaving those defaults in place. Mounting the
  # whole ConfigMap instead would replace them entirely.
  #
  # This name is the single source of truth: templates/thunder-bootstrap-configmap.yaml
  # reads it too, so the ConfigMap that gets created and the one the setup job
  # mounts are always the same object. Kept release-independent, matching the
  # global.serviceNames convention — one release per namespace.
  bootstrap:
    configMap:
      name: "thunder-bootstrap"
      files:
        - 70-mail-domain.yaml

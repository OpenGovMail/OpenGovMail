{{- if .Values.nextcloud.enabled }}
{{- /*
Registers Nextcloud as an OAuth client in ThunderID, then leaves the credentials in a
Secret for Nextcloud's post-installation hook to configure user_oidc with.

A Job rather than thunderid.declarativeResources, because that single mount already
carries ThunderID's TLS certificate. The setup job is pre-install only and cannot
re-run, so this uses the management API instead, authenticating as raven's existing
m2m client, which already holds the system permission.

Idempotent: it creates the client once, and on later runs updates it in place, so a
new host or secret reaches ThunderID on upgrade.
*/}}
{{- $clientSecret := include "opengovmail.nextcloudClientSecret" . }}
{{- $clientId := (((.Values.global).nextcloudIdp).clientId) | default "NEXTCLOUD" }}
{{- $host := include "opengovmail.nextcloudHost" . }}
{{- $thunderUrl := include "opengovmail.thunderUrl" . }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.nextcloudDeps.idpSecretName }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "opengovmail.labels" . | nindent 4 }}
    app.kubernetes.io/component: nextcloud-idp
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-6"
    "helm.sh/hook-delete-policy": before-hook-creation
type: Opaque
data:
  clientId: {{ $clientId | b64enc | quote }}
  clientSecret: {{ $clientSecret | b64enc | quote }}
  # Here because values files cannot be templated, and the hook needs the domain.
  discoveryUri: {{ printf "%s/.well-known/openid-configuration" $thunderUrl | b64enc | quote }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ .Release.Name }}-nextcloud-oidc-register
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "opengovmail.labels" . | nindent 4 }}
    app.kubernetes.io/component: nextcloud-oidc-register
  annotations:
    # post-install so ThunderID is up and its bootstrap has run.
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "5"
    "helm.sh/hook-delete-policy": before-hook-creation
spec:
  backoffLimit: 10
  template:
    metadata:
      labels:
        {{- include "opengovmail.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: nextcloud-oidc-register
    spec:
      restartPolicy: OnFailure
      containers:
        - name: register
          image: {{ .Values.nextcloudDeps.registerJob.image.repository }}:{{ .Values.nextcloudDeps.registerJob.image.tag }}
          env:
            - name: THUNDER_URL
              value: {{ $thunderUrl | quote }}
            - name: NC_CLIENT_ID
              value: {{ $clientId | quote }}
            - name: OU_HANDLE
              value: {{ .Values.nextcloudDeps.registerJob.ouHandle | quote }}
            - name: AUTH_FLOW_HANDLE
              value: {{ .Values.nextcloudDeps.registerJob.authFlowHandle | quote }}
            - name: ALLOWED_USER_TYPES
              value: {{ .Values.nextcloudDeps.registerJob.allowedUserTypes | toJson | quote }}
            - name: RESOURCE
              value: {{ .Values.nextcloudDeps.registerJob.resourceIdentifier | quote }}
            - name: NC_REDIRECT
              value: {{ printf "https://%s/apps/user_oidc/code" $host | quote }}
            - name: NC_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.nextcloudDeps.idpSecretName }}
                  key: clientSecret
            - name: RAVEN_CLIENT_ID
              value: {{ (((.Values.global).ravenIdp).clientId) | default "RAVEN_SYSTEM" | quote }}
            - name: RAVEN_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ (((.Values.global).ravenIdp).secretName) | default "opengovmail-raven-idp" }}
                  key: clientSecret
          resources:
            {{- toYaml .Values.nextcloudDeps.registerJob.resources | nindent 12 }}
          command: ["python3", "-c"]
          args:
            - |
              import json, os, sys, time, urllib.error, urllib.parse, urllib.request
              from base64 import b64encode

              BASE = os.environ["THUNDER_URL"]

              def call(path, token=None, data=None, method=None, basic=None):
                  req = urllib.request.Request(BASE + path, method=method)
                  if data is not None:
                      req.data = data if isinstance(data, bytes) else json.dumps(data).encode()
                      req.add_header("Content-Type", "application/json")
                  if token:
                      req.add_header("Authorization", "Bearer " + token)
                  if basic:
                      req.add_header("Authorization", "Basic " + b64encode(basic.encode()).decode())
                  with urllib.request.urlopen(req, timeout=30) as r:
                      body = r.read()
                      return r.status, (json.loads(body) if body else {})

              # ThunderID can still be starting when this hook runs.
              for _ in range(60):
                  try:
                      call("/.well-known/openid-configuration")
                      break
                  except Exception:
                      time.sleep(5)
              else:
                  sys.exit("ThunderID never became reachable")

              form = urllib.parse.urlencode({
                  "grant_type": "client_credentials",
                  "resource": os.environ["RESOURCE"],
                  "scope": "system",
              }).encode()
              req = urllib.request.Request(BASE + "/oauth2/token", data=form, method="POST")
              req.add_header("Authorization", "Basic " + b64encode(
                  f"{os.environ['RAVEN_CLIENT_ID']}:{os.environ['RAVEN_CLIENT_SECRET']}".encode()).decode())
              with urllib.request.urlopen(req, timeout=30) as r:
                  token = json.loads(r.read())["access_token"]

              # Lists default to 30 items, so read every page.
              def list_all(path, key):
                  items = []
                  while True:
                      _, page = call(f"{path}?limit=100&offset={len(items)}", token)
                      batch = page.get(key) or []
                      items += batch
                      if not batch or len(items) >= page.get("totalResults", 0):
                          return items

              # Resolve ids from handles. The UUIDs are install data, the handles are not.
              # Neither endpoint filters server side, so both are matched here.
              ou_handle = os.environ["OU_HANDLE"]
              ou = next((o for o in list_all("/organization-units", "organizationUnits") if o.get("handle") == ou_handle), None)
              if not ou:
                  sys.exit(f"no organization unit with handle {ou_handle}")

              want = os.environ["AUTH_FLOW_HANDLE"]
              flow_id = None
              for f in list_all("/flows", "flows"):
                  if f.get("handle") != want:
                      continue
                  # flowType is only on the individual resource, not the list.
                  _, full = call("/flows/" + f["id"], token)
                  if full.get("flowType") == "AUTHENTICATION":
                      flow_id = f["id"]
                      break
              if not flow_id:
                  sys.exit(f"no AUTHENTICATION flow with handle {want}")

              existing = next((a for a in list_all("/applications", "applications")
                               if a.get("clientId") == os.environ["NC_CLIENT_ID"]), None)

              app = {
                  "name": "Nextcloud",
                  "description": "OpenGovMail collaboration suite",
                  "ouId": ou["id"],
                  "type": "browser",
                  "authFlowId": flow_id,
                  "isRegistrationFlowEnabled": False,
                  "allowedUserTypes": json.loads(os.environ["ALLOWED_USER_TYPES"]),
                  "userAttributes": ["given_name", "family_name", "email", "groups", "name", "ouId"],
                  "inboundAuthConfig": [{
                      "type": "oauth2",
                      "config": {
                          "clientId": os.environ["NC_CLIENT_ID"],
                          "clientSecret": os.environ["NC_CLIENT_SECRET"],
                          "redirectUris": [os.environ["NC_REDIRECT"]],
                          "grantTypes": ["authorization_code", "refresh_token"],
                          "responseTypes": ["code"],
                          "pkceRequired": False,
                          "publicClient": False,
                          # user_oidc sends credentials in the body; basic fails only at
                          # the token exchange, after the user has already signed in.
                          "tokenEndpointAuthMethod": "client_secret_post",
                          "scopes": ["openid", "profile", "email", "group"],
                          # Without these ThunderID releases no name claim and every
                          # account arrives with a blank display name.
                          "scopeClaims": {
                              "profile": ["name", "given_name", "family_name"],
                              "email": ["email", "email_verified"],
                              "group": ["groups"],
                          },
                          "token": {
                              "idToken": {"userAttributes": ["name", "given_name", "family_name", "email", "groups"], "validityPeriod": 3600},
                              "accessToken": {"userAttributes": ["name", "email", "groups"], "validityPeriod": 3600},
                          },
                      },
                  }],
              }
              # PUT takes the same body as create, so the redirect URI and secret
              # follow the chart's values on every upgrade.
              try:
                  if existing:
                      status, _ = call("/applications/" + existing["id"], token, data=app, method="PUT")
                      print("updated", status)
                  else:
                      status, _ = call("/applications", token, data=app, method="POST")
                      print("registered", status)
              except urllib.error.HTTPError as e:
                  # A clash means a concurrent run created it; the retry updates it.
                  sys.exit(f"{e.code}: {e.read().decode()}")
{{- end }}

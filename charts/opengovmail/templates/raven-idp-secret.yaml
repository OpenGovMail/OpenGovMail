{{- if .Values.thunderid.enabled }}
{{- /*
Credentials raven uses against ThunderID. Two keys, obtained two different ways,
for a reason worth writing down.

Both are SUPPLIED on first install, then reused from the cluster on every render
after that. Neither can be generated the way the admin password is, and the reason
is the same for both: the value has to appear in two places that cannot see each
other's generated state.

  clientSecret       here, and in the bootstrap data that defines raven's
                     application (files/thunderid-bootstrap/). Two templates, two
                     independent `randAlphaNum` calls, and on a first install
                     neither can `lookup` the other's not-yet-created Secret.
  directAuthSecret   here, and in the vendored subchart's own values, which Helm
                     does not template.

So the operator supplies both once. Upgrades and reinstalls reuse whatever is
already in the cluster, so the flags are only needed for the first install of a
namespace. templates/domain-guard.yaml fails the render if the ThunderID copy of
the Direct Auth Secret disagrees with the one here.

Same hook weight and delete policy as thunder-admin-secret.yaml, and for the same
reason: the setup job at weight -5 must find these already present.
*/}}
{{- $idp := .Values.global.ravenIdp | default dict }}
{{- $name := required "global.ravenIdp.secretName is required when thunderid.enabled" $idp.secretName }}

{{- /* The Secret is useless if raven looks for a different name. Values files
     cannot be templated, so this is a separate literal — check it rather than
     letting a mismatch surface as a pod stuck in CreateContainerConfigError. */}}
{{- $ravenSecret := ((.Values.raven).thunder).idpSecretName }}
{{- if and $ravenSecret (ne $ravenSecret $name) }}
  {{- fail (printf "raven.thunder.idpSecretName (%s) must equal global.ravenIdp.secretName (%s): raven reads the credentials this Secret holds" $ravenSecret $name) }}
{{- end }}

{{- $clientSecret := include "opengovmail.ravenClientSecret" . }}
{{- $directAuthSecret := include "opengovmail.ravenDirectAuthSecret" . }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "opengovmail.labels" . | nindent 4 }}
    app.kubernetes.io/component: raven-idp-credentials
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    # Below the setup job's -5, so the bootstrap data can carry this client secret.
    "helm.sh/hook-weight": "-6"
    # Lets a reinstall recreate it instead of failing "already exists". The value is
    # read by `lookup` at render time, before this delete runs, so recreating keeps it.
    "helm.sh/hook-delete-policy": before-hook-creation
type: Opaque
data:
  clientSecret: {{ $clientSecret | b64enc | quote }}
  directAuthSecret: {{ $directAuthSecret | b64enc | quote }}
{{- end }}

name: Trivy Security Scan

on:
  push:
    branches: [ main ]
  pull_request:
  # Weekly, so new CVEs in dependencies that haven't changed still show up.
  schedule:
    - cron: '23 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  trivy-scan:
    name: Run Trivy Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Fails on a CRITICAL or HIGH vulnerability that has a fix, or on a secret.
      # Accept a finding by adding it to .trivyignore with a reason and an expiry date.
      - name: Scan for vulnerabilities and secrets
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: 'fs'
          scanners: 'vuln,secret'
          ignore-unfixed: true
          severity: 'CRITICAL,HIGH'
          format: 'table'
          exit-code: '1'
          trivyignores: '.trivyignore'

  # Sends the results to the Security tab, under Code scanning. Pull requests from
  # forks can't write security events, so this runs on main and on the weekly run.
  report:
    name: Report to code scanning
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    env:
      CHART: charts/opengovmail

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The misconfiguration scan renders the chart, which needs its dependencies.
      - name: Fetch chart dependencies
        run: |
          helm repo add nextcloud https://nextcloud.github.io/helm/
          helm dependency build "$CHART"

      - name: Scan for vulnerabilities and secrets
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: 'fs'
          scanners: 'vuln,secret'
          ignore-unfixed: true
          severity: 'CRITICAL,HIGH'
          limit-severities-for-sarif: true
          format: 'sarif'
          output: 'trivy-vuln.sarif'
          trivyignores: '.trivyignore'

      # Report-only for now: the chart and Dockerfiles have known findings to fix
      # or accept first. Without the placeholder values the chart fails to render,
      # and Trivy skips it without failing.
      - name: Scan the chart and Dockerfiles for misconfigurations
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          TRIVY_HELM_SET: >-
            global.domain=example.com,global.ravenIdp.clientSecret=ci,global.ravenIdp.directAuthSecret=ci,thunderid.configuration.server.security.directAuthSecret=ci
        with:
          scan-type: 'config'
          severity: 'CRITICAL,HIGH'
          limit-severities-for-sarif: true
          format: 'sarif'
          output: 'trivy-config.sarif'
          trivyignores: '.trivyignore'
          skip-setup-trivy: true

      - name: Upload vulnerability results
        uses: github/codeql-action/upload-sarif@915412ff23e8b7659517e607487dbeae018f2934 # v4.39.5
        with:
          sarif_file: 'trivy-vuln.sarif'
          category: 'trivy-vuln'

      - name: Upload misconfiguration results
        uses: github/codeql-action/upload-sarif@915412ff23e8b7659517e607487dbeae018f2934 # v4.39.5
        with:
          sarif_file: 'trivy-config.sarif'
          category: 'trivy-config'

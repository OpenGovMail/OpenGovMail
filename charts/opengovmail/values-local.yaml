# Local minikube bring-up for Thunder only, reachable via
#   kubectl port-forward svc/opengovmail-thunder-service 8090:8090
# and a browser at https://localhost:8090/console.
#
# No cert-manager, no mail services. TLS off so the umbrella skips Certificate
# objects; Thunder still serves HTTPS on 8090 with its bundled self-signed cert.
global:
  domain: localhost
  tls:
    enabled: false

opendkim:
  enabled: false
postfix:
  enabled: false

thunderid:
  enabled: true
  configuration:
    server:
      # Drives the base URL the console and gate SPAs call from the browser.
      publicUrl: "https://localhost:8090"
      # Must equal global.ravenIdp.directAuthSecret; templates/domain-guard.yaml
      # fails the render otherwise. Local-only value, fine to commit.
      security:
        directAuthSecret: "localdev-direct-auth-secret"
    gateClient:
      hostname: "localhost"
      port: 8090
      scheme: "https"
  setup:
    # Admin password comes from the Secret the umbrella generates
    # (templates/thunder-admin-secret.yaml); no kubectl step is needed. Read it with:
    #   kubectl get secret opengovmail-thunder-admin -n opengovmail \
    #     -o jsonpath='{.data.password}' | base64 -d
    admin:
      username: "admin"
      passwordRef:
        name: opengovmail-thunder-admin
        key: password

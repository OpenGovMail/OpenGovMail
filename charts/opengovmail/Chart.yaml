apiVersion: v2
name: opengovmail
description: Umbrella chart for OpenGovMail mail platform services
type: application
version: 0.1.0
appVersion: "0.1.0"

dependencies:
  - name: opendkim
    version: 0.1.0
    repository: file://charts/opendkim
    condition: opendkim.enabled
  - name: postfix
    version: 0.1.0
    repository: file://charts/postfix
    condition: postfix.enabled
  - name: redis
    version: 0.1.0
    repository: file://charts/redis
    condition: redis.enabled
  - name: unbound
    version: 0.1.0
    repository: file://charts/unbound
    condition: unbound.enabled
  - name: rspamd
    version: 0.1.0
    repository: file://charts/rspamd
    condition: rspamd.enabled
  - name: seaweedfs
    version: 0.1.0
    repository: file://charts/seaweedfs
    condition: seaweedfs.enabled
  - name: raven
    version: 0.1.0
    repository: file://charts/raven
    condition: raven.enabled
  # ThunderID identity server (upstream OCI chart). Mirrors the docker-compose
  # `thunderid`/`thunderid-setup`/`thunderid-db-init` services.
  #
  # Renamed upstream from asgardeo/thunder. 1.0.0-alpha2 also closed the route
  # raven used to obtain admin privileges, so it cannot be adopted without the
  # matching raven release — see charts/PLAN.md.
  - name: thunderid
    version: 1.0.0-alpha2
    repository: oci://ghcr.io/thunder-id/helm-charts
    condition: thunderid.enabled
